<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listing Aggregator Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --badge-bg: #0284c720;
            --badge-text: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 30px 20px; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .badge-count { background: var(--badge-bg); color: var(--badge-text); padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
        .search-bar { width: 100%; padding: 14px 18px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); margin-bottom: 25px; outline: none; }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th { background: #090d16; padding: 16px 20px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .job-title { font-weight: 600; font-size: 1.05rem; color: #ffffff; margin-bottom: 4px; }
        .company-name { color: var(--text-muted); font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }
        .location-badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 500; }
        .apply-btn { display: inline-block; background: var(--accent); color: #090d16; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; transition: all 0.2s ease; }
        .apply-btn:hover { background: var(--accent-hover); color: #ffffff; transform: translateY(-1px); }
        .print-btn { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .print-btn:hover { background: var(--card-bg); border-color: var(--accent); }
        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .table-container { background: transparent; border: none; box-shadow: none; overflow: visible; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tbody tr { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; padding: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
            td { border: none; padding: 6px 0; }
            .apply-btn { display: block; width: 100%; text-align: center; padding: 10px; margin-top: 8px; }
        }
        @media print {
            body { background: #ffffff; color: #000000; padding: 0; }
            .search-bar, .print-btn { display: none; }
            .table-container { box-shadow: none; border: 1px solid #ccc; }
            th { background: #f1f5f9; color: #000000; }
            td { border-bottom: 1px solid #e2e8f0; color: #000000; }
            .job-title { color: #000000; }
            .apply-btn { background: #0284c7; color: #ffffff; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🎯 Job Listing Aggregator</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Aggregated Job Results Report</p>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <span class="badge-count" id="job-count">31 Jobs Found</span>
                <button class="print-btn" onclick="window.print()">🖨️ Export PDF / Print</button>
            </div>
        </header>

        <div style="display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
            <input type="text" class="search-bar" id="search-input" style="flex: 1; margin-bottom: 0;" placeholder="🔍 Search by job title, company, or location..." onkeyup="applyFilterAndSort()">
            
            <div style="display: flex; align-items: center; gap: 8px;">
                <label for="sort-select" style="font-weight: 600; font-size: 0.88rem; color: var(--text-muted); white-space: nowrap;">Sort By:</label>
                <select id="sort-select" onchange="applyFilterAndSort()" style="padding: 12px 16px; border-radius: 10px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); font-size: 0.95rem; cursor: pointer; outline: none;">
                    <option value="newest" selected>⏱️ Most Recent First (Default)</option>
                    <option value="title_asc">🔤 Job Title (A → Z)</option>
                    <option value="title_desc">🔤 Job Title (Z → A)</option>
                    <option value="company_asc">🏢 Company Name (A → Z)</option>
                    <option value="location_asc">📍 Location (A → Z)</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr style="user-select: none;">
                        <th style="width: 32%; cursor: pointer;" onclick="toggleSortHeader('title')">Job Title & Company ↕</th>
                        <th style="width: 18%; cursor: pointer;" onclick="toggleSortHeader('location')">Location ↕</th>
                        <th style="width: 15%; cursor: pointer;" onclick="toggleSortHeader('date')">Date Posted ↕</th>
                        <th style="width: 23%;">Requirements</th>
                        <th style="width: 12%; text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="job-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const rawJobs = [{"title": "Junior Developer - Python & Go", "company": "Buyers Edge Platform", "location": "Waltham, MA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/junior-developer-python-go-buyers-edge-platform-JV_IC1154703_KO0,26_KE27,47.htm?jl=1010171665728"}, {"title": "Junior Python Developer", "company": "Leidos", "location": "Columbia, MD", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/junior-python-developer-leidos-JV_IC1153546_KO0,23_KE24,30.htm?jl=1010155112654"}, {"title": "Senior Python Developer", "company": "Deloitte", "location": "Jersey City, NJ", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-python-developer-deloitte-JV_IC1126819_KO0,23_KE24,32.htm?jl=1010195782599"}, {"title": "Senior Automation Engineer", "company": "Deloitte", "location": "Costa Mesa, CA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-automation-engineer-deloitte-JV_IC1146769_KO0,26_KE27,35.htm?jl=1010171906820"}, {"title": "Senior Software Engineer - Backend/Machine Learning (Remote)", "company": "The Home Depot", "location": "Atlanta, GA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-software-engineer-backend-machine-learning-remote-the-home-depot-JV_IC1155583_KO0,56_KE57,71.htm?jl=1010199847970"}, {"title": "Senior Software Engineer - Marketing Technology (Remote)", "company": "The Home Depot", "location": "Atlanta, GA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-software-engineer-marketing-technology-remote-the-home-depot-JV_IC1155583_KO0,52_KE53,67 date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/security-engineer-amazon-photos-amazon-JV_IC1150505_KO0,31_KE32,38.htm?jl=1010207318793"}, {"title": "Delivery Excellence - Tech Enablement - Senior Developer - Manager", "company": "PwC", "location": "United States", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/delivery-excellence-tech-enablement-senior-developer-manager-pwc-JV_KO0,60_KE61,64.htm?jl=1010161469922"}, {"title": "Acceleration Center- Agentic AI and Machine Learning Developer- Senior Associate", "company": "PwC", "location": "New York, NY", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/acceleration-center-agentic-ai-and-machine-learning-developer-senior-associate-pwc-JV_IC1132348_KO0,78_KE79,82.htm?jl=1010212889929"}, {"title": "Early Career: IT Security Engineer", "company": "Texas Instruments", "location": "Dallas, TX", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/early-career-it-security-engineer-texas-instruments-JV_IC1139977_KO0,33_KE34,51.htm?jl=1010214762886"}, {"title": "Lead Business Intelligence Engineer", "company": "Markel", "location": "Glen Allen, VA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/lead-business-intelligence-engineer-markel-JV_IC1130160_KO0,35_KE36,42.htm?jl=1010215011120"}, {"title": "Senior Software Engineer (Backend)", "company": "Panda Restaurant Group", "location": "Rosemead, CA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-software-engineer-backend-panda-restaurant-group-JV_IC1146861_KO0,32_KE33,55.htm?jl=1009768272480"}, {"title": "Experience Research Vice President-Personalization & Insights", "company": "JPMorganChase", "location": "Plano, TX", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/experience-research-vice-president-personalization-insights-jpmorgan-chase-co-JV_IC1140045_KO0,59_KE60,77.htm?jl=1010215142177"}, {"title": "Staff Engineer", "company": "The TJX Companies, Inc.", "location": "Framingham, MA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/staff-engineer-the-tjx-companies-inc-JV_IC1154571_KO0,14_KE15,36.htm?jl=1010095862024"}, {"title": "Application Software Developers/Engineer", "company": "One Federal Solution", "location": "Beltsville, MD", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/application-software-developers-engineer-one-federal-solution-JV_IC1153815_KO0,40_KE41,61.htm?jl=1010215081311"}, {"title": "Senior Engineer (Remote)", "company": "Tenet Healthcare", "location": "Frisco, TX", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-engineer-remote-tenet-healthcare-JV_IC1139994_KO0,22_KE23,39.htm?jl=1010041540628"}, {"title": "Data Scientist, Mid", "company": "Booz Allen Hamilton", "location": "Springfield, VA", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/data-scientist-mid-booz-allen-hamilton-JV_IC1130409_KO0,18_KE19,38.htm?jl=1010183877411"}, {"title": "Gaming Experience Full Stack Developer", "company": "Booz Allen Hamilton", "location": "Washington, DC", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/gaming-experience-full-stack-developer-booz-allen-hamilton-JV_IC1138213_KO0,38_KE39,58.htm?jl=1010188382968"}, {"title": "Software Engineer and Developer", "company": "Booz Allen Hamilton", "location": "Dayton, OH", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/software-engineer-and-developer-booz-allen-hamilton-JV_IC1145937_KO0,31_KE32,51.htm?jl=1010191915642"}, {"title": "Staff Software Engineer (Frontend Developer)", "company": "Lockheed Martin", "location": "Colorado Springs, CO", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/staff-software-engineer-frontend-developer-lockheed-martin-JV_IC1148136_KO0,42_KE43,58.htm?jl=1010171765381"}, {"title": "Senior AI Engineer", "company": "Chemours", "location": "United States", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/senior-ai-engineer-chemours-JV_KO0,18_KE19,27.htm?jl=1010188629730"}, {"title": "Robot Application Developer", "company": "Bright Vision Technologies", "location": "Remote", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/robot-application-developer-bright-vision-technologies-JV_KO0,27_KE28,54.htm?jl=1010212768480"}, {"title": "Kafka Engineer", "company": "Bright Vision Technologies", "location": "Remote", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/kafka-engineer-bright-vision-technologies-JV_KO0,14_KE15,41.htm?jl=1010212768387"}, {"title": "Kafka Platform Engineer", "company": "Bright Vision Technologies", "location": "Remote", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/kafka-platform-engineer-bright-vision-technologies-JV_KO0,23_KE24,50.htm?jl=1010212768388"}, {"title": "FinTech Software Developer", "company": "Bright Vision Technologies", "location": "Remote", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/job-listing/fintech-software-developer-bright-vision-technologies-JV_KO0,26_KE27,53.htm?jl=1010211093095"}, {"title": "Buyers Edge Platform\n4.0\nJunior Developer - Python & Go\nWaltham, MA\n$67K - $108K (Glassdoor est.)\nSign in to apply", "company": "Buyers Edge Platform", "location": "Waltham, MA\n$67K - $108K (Glassdoor est.)", "date_posted": "Recently", "requirements": "Click 'Apply Now' for full details", "link": "https://www.glassdoor.com/Overview/Working-at-Buyers-Edge-Platform-EI_IE2940257.11,31.htm"}];

        function renderJobs(data) {
            const tbody = document.getElementById("job-table-body");
            tbody.innerHTML = "";
            document.getElementById("job-count").innerText = `${data.length} Jobs Found`;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">No job listings match your search.</td></tr>`;
                return;
            }

            data.forEach(job => {
                const tr = document.createElement("tr");
                
                const titleCompany = `
                    <div>
                        <div class="job-title">${escapeHtml(job.title || 'N/A')}</div>
                        <div class="company-name">🏢 ${escapeHtml(job.company || 'N/A')}</div>
                    </div>
                `;

                const location = `
                    <span class="location-badge">📍 ${escapeHtml(job.location || 'Remote')}</span>
                `;

                const dateBadge = `<span style="display:inline-block; background:rgba(56, 189, 248, 0.1); color:var(--accent); padding:4px 10px; border-radius:6px; font-size:0.82rem; font-weight:600;">🕒 ${escapeHtml(job.date_posted || 'Recently')}</span>`;

                const reqs = `
                    <div style="color: var(--text-muted); font-size: 0.88rem; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        ${escapeHtml(job.requirements || 'N/A')}
                    </div>
                `;

                const applyBtn = job.link && job.link !== 'N/A' 
                    ? `<a href="${job.link}" target="_blank" class="apply-btn">Apply Now ↗</a>` 
                    : `<span style="color: var(--text-muted);">N/A</span>`;

                tr.innerHTML = `
                    <td>${titleCompany}</td>
                    <td>${location}</td>
                    <td>${dateBadge}</td>
                    <td>${reqs}</td>
                    <td style="text-align: center;">${applyBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSortHeader(field) {
            const selectElem = document.getElementById("sort-select");
            if (field === 'title') {
                selectElem.value = (selectElem.value === 'title_asc') ? 'title_desc' : 'title_asc';
            } else if (field === 'location') {
                selectElem.value = 'location_asc';
            } else if (field === 'date') {
                selectElem.value = 'newest';
            }
            applyFilterAndSort();
        }

        function applyFilterAndSort() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const sortOption = document.getElementById("sort-select").value;

            let filtered = rawJobs.filter(j => 
                (j.title && j.title.toLowerCase().includes(query)) ||
                (j.company && j.company.toLowerCase().includes(query)) ||
                (j.location && j.location.toLowerCase().includes(query)) ||
                (j.date_posted && j.date_posted.toLowerCase().includes(query))
            );

            if (sortOption === "title_asc") {
                filtered.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
            } else if (sortOption === "title_desc") {
                filtered.sort((a, b) => (b.title || "").localeCompare(a.title || ""));
            } else if (sortOption === "company_asc") {
                filtered.sort((a, b) => (a.company || "").localeCompare(b.company || ""));
            } else if (sortOption === "location_asc") {
                filtered.sort((a, b) => (a.location || "").localeCompare(b.location || ""));
            }

            renderJobs(filtered);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // Initial render
        applyFilterAndSort();
    </script>
</body>
</html>
